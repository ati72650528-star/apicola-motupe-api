services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apicola_app
    ports:
      - "8082:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db
  db:
    image: mysql:8.0
    container_name: apicola_db
    environment:
      MYSQL_DATABASE: bd_apicola
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3309:3306"
    volumes:
      - mysql_data:/var/lib/mysql
volumes:
  mysql_data: